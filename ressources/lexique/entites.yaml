# camp : gauche | centre | droite | null. Rattachement de la personne publique d'après sa formation
#        et ses déclarations, jamais d'après l'opinion d'un internaute. null = aucune source solide
#        ou personnalité non partisane. Règle, sources et cas litigieux : docs/technique/camps-candidats.md
