més ici : did, rkey, cid, rev,</text><text x="573.65" y="253.277" fill="#000" font-size="13" textLength="201.591">reply, embed, createdAt, mentions.</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="41"><path d="M910.12,178.2 L910.12,258.2 A4,4 0 0 0 914.12,262.2 L1039.24,262.2 L1043.24,312.42 L1047.24,262.2 L1172.365,262.2 A4,4 0 0 0 1176.365,258.2 L1176.365,184.2 L1166.365,174.2 L914.12,174.2 A4,4 0 0 0 910.12,178.2" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFF8DC"/><path d="M1166.365,174.2 L1166.365,182.2 A2,2 0 0 0 1168.365,184.2 L1176.365,184.2 L1166.365,174.2" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFF8DC"/><text x="916.12" y="191.277" fill="#000" font-size="13" textLength="194.376">Le texte est jeté après le scoring ;</text><text x="916.12" y="206.877" fill="#000" font-size="13" textLength="239.174">une copie nettoyée reste dans les fichiers</text><text x="916.12" y="222.477" fill="#000" font-size="13" textLength="227.578">shuffle des workers (/tmp, non chiffrés).</text><text x="916.12" y="238.077" fill="#000" font-size="13" textLength="245.245">L'heure précise (time_us) sert à la latence,</text><text x="916.12" y="253.677" fill="#000" font-size="13" textLength="192.92">puis est remplacée par la fenêtre.</text></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-line="49"><path d="M1960.76,159.8 L1960.76,208.6 A4,4 0 0 0 1964.76,212.6 L2094.44,212.6 L2098.44,263.36 L2102.44,212.6 L2232.118,212.6 A4,4 0 0 0 2236.118,208.6 L2236.118,165.8 L2226.118,155.8 L1964.76,155.8 A4,4 0 0 0 1960.76,159.8" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFF8DC"/><path d="M2226.118,155.8 L2226.118,163.8 A2,2 0 0 0 2228.118,165.8 L2236.118,165.8 L2226.118,155.8" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFF8DC"/><text x="1966.76" y="172.877" fill="#000" font-size="13" textLength="223.275">Ni texte, ni identifiant, ni pseudonyme :</text><text x="1966.76" y="188.477" fill="#000" font-size="13" textLength="222.56">des scores par candidat et par fenêtre.</text><text x="1966.76" y="204.077" fill="#000" font-size="13" textLength="254.358">Les journaux ne portent que des compteurs.</text></g><g class="entity" data-qualified-name="GMN33" id="ent0034" data-source-line="55"><path d="M508.76,46.6 L508.76,79.8 A4,4 0 0 0 512.76,83.8 L674.94,83.8 L678.94,134.43 L682.94,83.8 L845.118,83.8 A4,4 0 0 0 849.118,79.8 L849.118,52.6 L839.118,42.6 L512.76,42.6 A4,4 0 0 0 508.76,46.6" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFF8DC"/><path d="M839.118,42.6 L839.118,50.6 A2,2 0 0 0 841.118,52.6 L849.118,52.6 L839.118,42.6" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFF8DC"/><text x="514.76" y="59.677" fill="#000" font-size="13" textLength="247.429">Seul le silver part, sans identifiant d'auteur.</text><text x="514.76" y="75.277" fill="#000" font-size="13" textLength="319.358">Le run (modèle, métriques) revient, la copie est purgée.</text></g><!--link kafka to st1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk15" data-source-line="25" data-link-type="dependency"><path d="M273.26,339.73 C371,339.36 499.65,338.879 586.13,338.549" style="stroke:#333;stroke-width:1;" fill="none" id="kafka-to-st1"/><polygon points="591.13,338.53,582.115,334.564,586.13,338.549,582.145,342.564,591.13,338.53" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link st1 to st2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk16" data-source-line="26" data-link-type="dependency"><path d="M766.72,338.2 C829.21,338.2 907.49,338.2 966.07,338.2" style="stroke:#333;stroke-width:1;" fill="none" id="st1-to-st2"/><polygon points="971.07,338.2,962.07,334.2,966.07,338.2,962.07,342.2,971.07,338.2" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link st2 to st6--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk17" data-source-line="27" 