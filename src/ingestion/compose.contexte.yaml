name: sae-collecte-contexte
services:
  collecte:
    build: .
    image: sae-collecte-contexte:1
    container_name: sae-collecte-contexte
    restart: unless-stopped
    init: true
    user: "1000:1000"
    command: ["python", "ingestion.py", "--nouveau-corpus", "--db", "/data/nouveau_corpus.db", "--keywords", "/app/keywords.txt", "--heartbeat", "/tmp/heartbeat"]
    environment:
      CONTEXTE_MAX_PAR_MINUTE: "60"
    volumes:
      - ./data:/data
      - ./keywords.txt:/app/keywords.txt:ro
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 0.3
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<180 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
