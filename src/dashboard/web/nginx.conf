server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Always revalidate (ETag -> 304): content changes without file names changing.
    # `expires` rather than add_header Cache-Control: an add_header in a location block
    # would cancel the inheritance of the security headers below.
    expires -1;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;

    # The Vite bundle is compiled ahead of time: no eval, no inline script, no inline style
    # attribute in the markup (React sets styles through the CSSOM, which
    # style-src does not restrict).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed bundle (assets/) and versioned font (fonts/): the file name changes with the
    # content, so a year-long cache is safe. `expires` only: an add_header here would cancel
    # the inheritance of the security headers above (hence no `immutable`).
    location ~ ^/(assets|fonts)/ {
        expires 1y;
        try_files $uri =404;
    }

    # Reverse proxy to the API: the only entry point, the API has no published port. Same
    # origin for the browser: no CORS, CSP connect-src 'self' is enough.
    location /api/ {
        # Docker's DNS, name resolved on every request (not once at startup): nginx starts
        # even if the API is absent (the page then shows a 502 error) and follows its address
        # change when the container is recreated.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://dashboard-api:8000;
        proxy_pass $api_upstream;   # pas de partie URI : /api/tableau -> dashboard-api:8000/api/tableau

        # The API sets its own Cache-Control; do not add the server's on top.
        expires off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
