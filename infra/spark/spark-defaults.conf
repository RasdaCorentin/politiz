# Réglages communs au master, aux workers et aux applications soumises (pile et job Spark : docs/technique/contrats-poc.md).
# Aucun secret ici : les identifiants viennent de l'environnement et des --conf de soumission.

spark.master                                 spark://spark-master:7077
spark.sql.session.timeZone                   UTC
# 4 cœurs au total, 4 partitions Kafka : 200 partitions de shuffle (défaut) multiplieraient
# les fichiers d'état écrits sur S3 à chaque micro-lot.
spark.sql.shuffle.partitions                 4

# Journaux des executors : taille bornée, nettoyés par le worker (voir docker-compose.yml).
spark.executor.logs.rolling.strategy         size
spark.executor.logs.rolling.maxSize          10485760
spark.executor.logs.rolling.maxRetainedFiles 3

# S3A -> MinIO (chemin d'accès path-style, sans SSL). Les clés viennent de l'environnement
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) ou de spark.hadoop.fs.s3a.access.key / secret.key.
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider,com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Catalogue ClickHouse (clickhouse-spark). user et password : --conf de soumission.
spark.sql.catalog.clickhouse                 com.clickhouse.spark.ClickHouseCatalog
spark.sql.catalog.clickhouse.protocol        http
spark.sql.catalog.clickhouse.host            clickhouse
spark.sql.catalog.clickhouse.http_port       8123
spark.sql.catalog.clickhouse.database        sae
